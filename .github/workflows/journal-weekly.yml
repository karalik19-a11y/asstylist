name: Journal weekly issue

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-journal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build weekly issue
        run: python3 scripts/build_journal.py

      - name: Commit issue
        run: |
          git config user.name "ASStylist Journal Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/journal.json
          if git diff --cached --quiet; then
            echo "No journal changes"
            exit 0
          fi
          git commit -m "chore(journal): publish weekly issue"
          git push
