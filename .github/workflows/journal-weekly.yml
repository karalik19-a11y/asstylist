name: Journal weekly issue

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_journal.py'
      - 'scripts/build_first_journal.py'
      - '.github/workflows/journal-weekly.yml'

permissions:
  contents: write

jobs:
  build-journal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build launch issue with guaranteed image pipeline
        if: github.event_name == 'push'
        run: python3 scripts/build_first_journal.py

      - name: Build weekly issue
        if: github.event_name != 'push'
        run: python3 scripts/build_journal.py

      - name: Validate issue before publishing
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          p=Path('frontend/public/journal.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          articles=data.get('articles', [])
          images=sum(bool(a.get('image_url')) for a in articles)
          print(f'articles={len(articles)} images={images}')
          if len(articles) < 8:
              print('Journal build rejected: fewer than 8 articles. Keeping previous issue.')
              sys.exit(1)
          if images / len(articles) < 0.70:
              print('Journal build rejected: fewer than 70% of articles have cached images. Keeping previous issue.')
              sys.exit(1)
          PY

      - name: Commit issue and images
        run: |
          git config user.name "ASStylist Journal Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/journal.json frontend/public/journal-images
          if git diff --cached --quiet; then
            echo "No journal changes"
            exit 0
          fi
          git commit -m "chore(journal): publish weekly issue"
          git push
